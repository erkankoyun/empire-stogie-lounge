name: V3.1 Technical Hardening

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build helpers
        run: |
          python3 -m pip install --quiet pillow beautifulsoup4

      - name: Build official logo assets
        run: |
          cat assets/logo.part1.txt assets/logo.part2.txt assets/logo.part3.txt | tr -d '\r\n\t ' | base64 -d > assets/logo-official.jpg
          python3 - <<'PY'
          from PIL import Image
          img = Image.open('assets/logo-official.jpg')
          img.verify()
          img = Image.open('assets/logo-official.jpg').convert('RGB')
          fav = img.copy()
          fav.thumbnail((96,96), Image.Resampling.LANCZOS)
          fav.save('assets/favicon.png', optimize=True)
          print('logo', img.size, 'favicon', fav.size)
          PY

      - name: Create responsive image variants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          stems = ['IMG_8965','IMG_8966','IMG_8968','IMG_8969','IMG_8970','IMG_8971']
          outdir = Path('assets/responsive')
          outdir.mkdir(parents=True, exist_ok=True)
          for stem in stems:
              src = Path(f'{stem}.webp')
              img = Image.open(src).convert('RGB')
              ow, oh = img.size
              for target in (480, 768, 1200):
                  if target >= ow:
                      continue
                  nh = round(oh * target / ow)
                  resized = img.resize((target, nh), Image.Resampling.LANCZOS)
                  resized.save(outdir / f'{stem}-{target}.webp', 'WEBP', quality=80, method=6)
              print(stem, img.size)
          PY

      - name: Prepare V3.1 CSS and minify
        run: |
          cat > /tmp/v31.css <<'CSS'
          /* V3.1 technical polish */
          html.age-gate-active,html.age-gate-active body{overflow:hidden}
          .age-gate:not(.hidden){display:grid}
          .age-card{outline:none}
          .age-actions a,.age-actions button{touch-action:manipulation}
          img{max-width:100%;height:auto}
          .hero-visual img,.humidor-media img,.gallery-card img,.update-card-media img,.instagram-tile img{height:100%}
          @media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important}}
          CSS
          npx --yes clean-css-cli -o site.min.css styles.css gallery-patch.css premium-v2.css premium-v3.css /tmp/v31.css

      - name: Update HTML and responsive image metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          from PIL import Image
          import re

          css_files = {'styles.css','gallery-patch.css','premium-v2.css','premium-v3.css'}
          main = Path('index.html')
          html = main.read_text()
          soup = BeautifulSoup(html, 'html.parser')

          # Replace layered CSS with one production stylesheet.
          for link in list(soup.find_all('link', rel='stylesheet')):
              href = (link.get('href') or '').split('?')[0]
              if href in css_files:
                  link.decompose()
          font_link = None
          for link in soup.find_all('link', rel='stylesheet'):
              if 'fonts.googleapis.com' in (link.get('href') or ''):
                  font_link = link
          new_css = soup.new_tag('link', rel='stylesheet', href='site.min.css?v=3.1')
          if font_link:
              font_link.insert_after(new_css)
          elif soup.head:
              soup.head.append(new_css)

          # Favicon and logo cleanup.
          fav = soup.find('link', id='siteFavicon')
          if fav:
              fav['href'] = 'assets/favicon.png'
              fav['type'] = 'image/png'
          for img in soup.find_all('img'):
              if (img.get('src') or '') == 'assets/logo.jpg':
                  img['src'] = 'assets/logo-official.jpg'

          # Improve metadata.
          if not soup.find('meta', attrs={'property':'og:locale'}):
              tag = soup.new_tag('meta')
              tag['property'] = 'og:locale'
              tag['content'] = 'en_US'
              ogtype = soup.find('meta', attrs={'property':'og:type'})
              if ogtype:
                  ogtype.insert_before(tag)
          viewport = soup.find('meta', attrs={'name':'viewport'})
          if viewport:
              viewport['content'] = 'width=device-width, initial-scale=1, viewport-fit=cover'

          # Responsive srcset + intrinsic dimensions for core images.
          stems = {'IMG_8965','IMG_8966','IMG_8968','IMG_8969','IMG_8970','IMG_8971'}
          dims = {}
          for stem in stems:
              with Image.open(f'{stem}.webp') as im:
                  dims[stem] = im.size

          def ancestor_has(img, cls):
              p = img.parent
              while p is not None and getattr(p, 'name', None) != 'body':
                  if cls in (p.get('class') or []): return True
                  p = p.parent
              return False

          for img in soup.find_all('img'):
              src = img.get('src') or ''
              m = re.fullmatch(r'(IMG_\d+)\.webp', src)
              if not m or m.group(1) not in stems:
                  continue
              stem = m.group(1)
              ow, oh = dims[stem]
              entries = []
              for w in (480,768,1200):
                  p = Path(f'assets/responsive/{stem}-{w}.webp')
                  if p.exists(): entries.append(f'{p.as_posix()} {w}w')
              entries.append(f'{stem}.webp {ow}w')
              img['srcset'] = ', '.join(entries)
              if ancestor_has(img, 'instagram-grid'):
                  img['sizes'] = '(max-width: 520px) 50vw, (max-width: 820px) 50vw, 25vw'
              elif ancestor_has(img, 'gallery-grid'):
                  img['sizes'] = '(max-width: 520px) 100vw, (max-width: 820px) 50vw, 33vw'
              elif ancestor_has(img, 'update-card-media'):
                  img['sizes'] = '(max-width: 820px) 100vw, 33vw'
              else:
                  img['sizes'] = '(max-width: 820px) 100vw, 55vw'
              img['width'] = str(ow)
              img['height'] = str(oh)
              img['decoding'] = 'async'

          # Use versioned deferred JS.
          script = soup.find('script', src=re.compile(r'^script\.js'))
          if script:
              script['src'] = 'script.js?v=3.1'
              script['defer'] = ''

          main.write_text(str(soup), encoding='utf-8')

          # Update standalone pages to use one stylesheet and official logo.
          for fname in ('privacy.html','terms.html','404.html'):
              p = Path(fname)
              if not p.exists(): continue
              s = p.read_text()
              s = s.replace('assets/logo.jpg','assets/logo-official.jpg')
              doc = BeautifulSoup(s, 'html.parser')
              for link in list(doc.find_all('link', rel='stylesheet')):
                  href=(link.get('href') or '').split('?')[0]
                  if href in css_files:
                      link.decompose()
              if not doc.find('link', href=re.compile(r'^site\.min\.css')) and doc.head:
                  doc.head.append(doc.new_tag('link', rel='stylesheet', href='site.min.css?v=3.1'))
              p.write_text(str(doc), encoding='utf-8')
          PY

      - name: Harden age gate and remove legacy logo loader
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('script.js')
          s = p.read_text()
          s = re.sub(r"async function loadOfficialLogo\(\) \{.*?\n\}\n\nloadOfficialLogo\(\);\n\n", "", s, flags=re.S)
          start = s.index('// Age gate:')
          end = s.index('// Mobile navigation.')
          gate = r'''// Age gate: accessible focus management without collecting personal data.
          const gateFocusable = () => gate ? Array.from(gate.querySelectorAll('a[href], button:not([disabled]), [tabindex]:not([tabindex="-1"])')) : [];
          const backgroundNodes = () => Array.from(document.body.children).filter((node) => node !== gate && node.tagName !== 'SCRIPT');

          function setAgeGateOpen(open) {
            document.documentElement.classList.toggle('age-gate-active', open);
            backgroundNodes().forEach((node) => { node.inert = open; });
            if (!gate) return;
            gate.setAttribute('aria-hidden', String(!open));
            if (open) {
              gate.classList.remove('hidden');
              requestAnimationFrame(() => (enter || gateFocusable()[0])?.focus());
            } else {
              gate.classList.add('hidden');
              document.querySelector('.brand')?.focus();
            }
          }

          let allowed = false;
          try { allowed = localStorage.getItem('empireAgeVerified') === 'true'; } catch (_) {}
          setAgeGateOpen(!allowed);

          if (enter && gate) {
            enter.addEventListener('click', () => {
              try { localStorage.setItem('empireAgeVerified', 'true'); } catch (_) {}
              setAgeGateOpen(false);
            });
            gate.addEventListener('keydown', (event) => {
              if (event.key !== 'Tab') return;
              const items = gateFocusable();
              if (!items.length) return;
              const first = items[0], last = items[items.length - 1];
              if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
              else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
            });
          }

          '''
          s = s[:start] + gate + s[end:]
          p.write_text(s)
          PY

      - name: Add Cloudflare security and cache headers
        run: |
          cat > _headers <<'EOF'
          /*
            X-Content-Type-Options: nosniff
            Referrer-Policy: strict-origin-when-cross-origin
            X-Frame-Options: SAMEORIGIN
            Permissions-Policy: camera=(), microphone=(), geolocation=(), payment=(), usb=()
            Cross-Origin-Opener-Policy: same-origin
            Content-Security-Policy: default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; frame-src https://www.google.com https://maps.google.com; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'; upgrade-insecure-requests
            Cache-Control: public, max-age=0, must-revalidate

          /site.min.css
            Cache-Control: public, max-age=86400

          /script.js
            Cache-Control: public, max-age=86400

          /*.webp
            Cache-Control: public, max-age=2592000, immutable

          /*.jpeg
            Cache-Control: public, max-age=2592000, immutable

          /*.png
            Cache-Control: public, max-age=2592000, immutable

          /assets/responsive/*
            Cache-Control: public, max-age=31536000, immutable
          EOF

      - name: Remove obsolete generated and legacy files
        run: |
          rm -f styles.css gallery-patch.css premium-v2.css premium-v3.css
          rm -f assets/.keep-logo-update assets/DO_NOT_USE.txt assets/logo-binary-upload-needed.txt assets/logo-current-note.txt assets/logo-final-status.txt assets/logo-official-512.txt assets/logo-official-readme.md assets/logo-official-source.txt assets/logo-replacement-pending.txt assets/logo-source-note.txt assets/logo-temp.b64.txt assets/logo-upload-instructions.txt
          rm -f assets/logo.part1.txt assets/logo.part2.txt assets/logo.part3.txt assets/logo.jpg
          rm -f assets/cigars.jpg assets/interior.jpg assets/opening.jpg
          rm -f .github/workflows/v3-1-hardening.yml

      - name: Commit V3.1 technical perfection pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete V3.1 technical hardening and performance pass"
          git push
