name: Optimize Site Images

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install WebP encoder
        run: |
          sudo apt-get update
          sudo apt-get install -y webp
      - name: Create optimized WebP images
        run: |
          for f in IMG_8965.jpeg IMG_8966.jpeg IMG_8968.jpeg IMG_8969.jpeg IMG_8970.jpeg IMG_8971.jpeg; do
            out="${f%.jpeg}.webp"
            cwebp -quiet -q 82 "$f" -o "$out"
          done
      - name: Use WebP images in page content
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          for stem in ['IMG_8965','IMG_8966','IMG_8968','IMG_8969','IMG_8970','IMG_8971']:
              s = s.replace(f'src="{stem}.jpeg"', f'src="{stem}.webp"')
              s = s.replace(f'data-full="{stem}.jpeg"', f'data-full="{stem}.webp"')
          s = s.replace('rel="preload" as="image" href="IMG_8968.jpeg"', 'rel="preload" as="image" href="IMG_8968.webp" type="image/webp"')
          p.write_text(s)
          PY
      - name: Commit performance changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html IMG_8965.webp IMG_8966.webp IMG_8968.webp IMG_8969.webp IMG_8970.webp IMG_8971.webp
          if git diff --cached --quiet; then
            echo "No performance changes to commit"
          else
            git commit -m "Use optimized WebP images across V3 site"
            git push
          fi
