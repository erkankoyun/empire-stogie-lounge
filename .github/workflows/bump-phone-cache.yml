name: Bump Phone Cache

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  bump-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump script cache key
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'script.js?v=3.1'
          new = 'script.js?v=3.1.1'
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('script version marker not found')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and remove workflow
        run: |
          rm -f .github/workflows/bump-phone-cache.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/bump-phone-cache.yml
          git commit -m "Refresh phone CTA cache key"
          git push origin main
