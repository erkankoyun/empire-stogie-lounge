name: Add Store Hours

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-hours:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply verified hours
        run: python3 .github/scripts/add-store-hours.py

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/add-store-hours.yml .github/scripts/add-store-hours.py
          git add index.html script.js
          git commit -m "Add verified Empire Stogie Lounge hours"
          git push
