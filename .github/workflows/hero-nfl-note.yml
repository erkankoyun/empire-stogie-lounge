name: Hero NFL Note Fix

on:
  push:
    paths:
      - '.github/workflows/hero-nfl-note.yml'

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Add hero NFL note and use official logo
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old = '<span class="status-note">Monday–Sunday · 11 AM–9 PM</span>'
          new = old + '\n<span class="status-note hero-nfl-note">Open Late for NFL <img class="nfl-inline-logo" src="assets/nfl-logo.png" alt="NFL logo"/> Games</span>'
          if 'hero-nfl-note' not in s:
              if old not in s:
                  raise SystemExit('Hero hours line not found')
              s = s.replace(old, new, 1)

          s = s.replace('assets/nfl-logo.svg', 'assets/nfl-logo.png')
          s = s.replace('script.js?v=3.3', 'script.js?v=3.4')
          s = s.replace('site.min.css?v=3.3', 'site.min.css?v=3.4')
          p.write_text(s, encoding='utf-8')

          css = Path('site.min.css')
          c = css.read_text(encoding='utf-8')
          marker = '.hero-nfl-note{'
          if marker not in c:
              c += '\n.hero-nfl-note{display:flex;align-items:center;gap:.42rem;flex-basis:100%;margin-top:.15rem}.hero-nfl-note .nfl-inline-logo{width:22px;height:22px;object-fit:contain;display:inline-block;vertical-align:middle}\n'
              css.write_text(c, encoding='utf-8')

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html site.min.css
          git diff --cached --quiet && exit 0
          git commit -m "Add NFL game-night note below hero hours"
          git push origin main
